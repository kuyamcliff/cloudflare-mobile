# Production verification: secret scan, API schema drift, JVM and Robolectric UI tests,
# lint, and debug plus release APKs. A release APK is only produced after tests pass.
name: Android CI

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    # Weekly schema drift check against Cloudflare's published OpenAPI schema.
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Scan tracked files for credentials
        run: python3 tools/ci/secret_scan.py

  api-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Fetch Cloudflare's OpenAPI schema
        run: |
          git clone --depth 1 https://github.com/cloudflare/api-schemas.git /tmp/api-schemas
          echo "SCHEMA_REV=$(git -C /tmp/api-schemas rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Regenerate registry and diff against the shipped one
        # Exit code 2 means an endpoint the app calls natively was removed or gained a
        # required parameter: a breaking change that must be handled before release.
        run: |
          cp app/src/main/assets/cf_endpoints.bin /tmp/previous.bin
          python3 tools/openapi/generate_registry.py --schema /tmp/api-schemas/openapi.json \
            --revision "$SCHEMA_REV" --previous /tmp/previous.bin | tee /tmp/schema-diff.txt
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-coverage
          path: |
            build/api-coverage.json
            docs/API_COVERAGE.md
            /tmp/schema-diff.txt
          retention-days: 30

  build-test-lint:
    needs: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Unit, integration and Robolectric UI tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Lint
        run: ./gradlew lintRelease --stacktrace

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Decode release keystore
        if: ${{ env.KEYSTORE_B64 != '' }}
        env:
          KEYSTORE_B64: ${{ secrets.CF_RELEASE_KEYSTORE_B64 }}
        run: echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Assemble release APK
        env:
          CF_RELEASE_STORE_FILE: ${{ secrets.CF_RELEASE_KEYSTORE_B64 != '' && format('{0}/release.jks', runner.temp) || '' }}
          CF_RELEASE_STORE_PASSWORD: ${{ secrets.CF_RELEASE_STORE_PASSWORD }}
          CF_RELEASE_KEY_ALIAS: ${{ secrets.CF_RELEASE_KEY_ALIAS }}
          CF_RELEASE_KEY_PASSWORD: ${{ secrets.CF_RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-control-apks
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-release.html
          if-no-files-found: warn
          retention-days: 14
